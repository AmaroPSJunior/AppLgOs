<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Script de debug para webOS -->
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var message = [
          'ERR: ' + msg,
          'At: ' + url + ':' + lineNo + ':' + columnNo,
          'Obj: ' + JSON.stringify(error)
        ].join('\n');
        console.error(message);
        var debugDiv = document.getElementById('webos-debug') || document.createElement('div');
        debugDiv.id = 'webos-debug';
        debugDiv.style.position = 'fixed';
        debugDiv.style.top = '0';
        debugDiv.style.left = '0';
        debugDiv.style.background = 'rgba(255,0,0,0.9)';
        debugDiv.style.color = 'white';
        debugDiv.style.zIndex = '10000';
        debugDiv.style.fontSize = '14px';
        debugDiv.style.padding = '20px';
        debugDiv.style.whiteSpace = 'pre-wrap';
        debugDiv.innerText += message + '\n---\n';
        if (!debugDiv.parentElement) document.body.appendChild(debugDiv);
        return false;
      };

      // Catch asset errors
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'LINK' || e.target.tagName === 'SCRIPT')) {
          console.error('Failed to load: ' + (e.target.src || e.target.href));
        }
      }, true);
      
      console.log('webOS Debug Script Initialized');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
