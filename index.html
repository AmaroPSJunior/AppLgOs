<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo Amaro</title>
    <style>
        /* CSS Clássico compatível com Chrome 38+ */
        body {
            background-color: #0c0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            width: 1920px; /* Tamanho padrão Full HD para TV */
            height: 1080px;
            overflow: hidden;
            display: table; /* Fallback para centralização se flex falhar */
        }
        .container {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0c0e14 100%);
        }
        h1 {
            font-size: 100px;
            margin: 0;
            color: #ffffff;
            font-weight: 800;
        }
        .highlight {
            color: #3b82f6;
        }
        p {
            font-size: 40px;
            color: #64748b;
            margin-top: 20px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        .footer {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            font-size: 20px;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo <span class="highlight">Amaro!</span></h1>
        <p>webOS TV Native Experience</p>
    </div>
    <div class="footer">
        Versão 1.2 - Pure Legacy HTML
    </div>
    <script>
        // Log simples para debug no Inspector
        console.log("App carregado com sucesso!");
    </script>
</body>
</html>
