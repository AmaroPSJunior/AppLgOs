<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>webOS Test App</title>
    <style>
        /* CSS Ultra Simples - Sem Flebox Avançado ou CSS Variables */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        .header {
            background-color: #005eb8;
            color: white;
            padding: 20px;
            font-size: 24px;
        }

        .content {
            padding: 40px;
        }

        .welcome-msg {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .status-box {
            border: 2px solid #333;
            padding: 20px;
            margin: 20px auto;
            width: 60%;
            background-color: #f0f0f0;
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #333;
            color: white;
            padding: 15px 0;
        }

        .btn {
            padding: 10px 20px;
            background-color: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Cores dos botões do controle */
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .red { background-color: red; }
        .green { background-color: green; }
        .yellow { background-color: yellow; }
        .blue { background-color: blue; }
        
        .tag { margin: 0 10px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        webOS Workspace v1.0.3
    </div>

    <div class="content">
        <div id="display-text" class="welcome-msg">Bem-vindo ao nosso app!</div>
        <p>Este layout foi simplificado para compatibilidade total.</p>
        
        <div class="status-box">
            <strong>MODO DE SEGURANÇA ATIVO</strong><br>
            Tudo embutido no HTML (Vanilla JS/CSS).
        </div>

        <button class="btn" id="main-btn">Trocar Cor de Fundo</button>
    </div>

    <div class="footer">
        <span class="tag"><span class="dot red"></span> Sair</span>
        <span class="tag"><span class="dot green"></span> Menu</span>
        <span class="tag"><span class="dot yellow"></span> Opções</span>
        <span class="tag"><span class="tag"><span class="dot blue"></span> Ajuda</span>
    </div>

    <script>
        // JavaScript Purista (ES5) - Sem let, const ou arrow functions
        window.onload = function() {
            var btn = document.getElementById('main-btn');
            var isGray = false;
            
            if (btn) {
                btn.onclick = function() {
                    isGray = !isGray;
                    document.body.style.backgroundColor = isGray ? '#d1d5db' : '#ffffff';
                    btn.innerHTML = isGray ? 'Voltar para Branco' : 'Trocar Cor de Fundo';
                };
            }
            
            console.log("App webOS Carregado em modo de segurança.");
        };
    </script>
</body>
</html>
